name: Android CI

on:
  push:
    branches: [android]
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify wrapper checksum
        run: echo '81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
      - name: Run unit tests, lint, and debug build
        id: gradle
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug 2>&1 | tee gradle-output.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Publish failure diagnostics
        if: failure() && steps.gradle.outcome == 'failure'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          lines = Path('gradle-output.log').read_text(errors='replace').splitlines()
          patterns = re.compile(r'(^e: |^w: |FAILURE:|What went wrong|Execution failed|Compilation error|Unresolved reference|error:)', re.I)
          matches = [line for line in lines if patterns.search(line)]
          if not matches:
              matches = lines[-120:]
          for line in matches[:200]:
              safe = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error::{safe}')
          PY
      - name: Upload reports and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification
          if-no-files-found: warn
          path: |
            android/gradle-output.log
            android/app/build/reports/**
            android/app/build/outputs/apk/debug/*.apk
