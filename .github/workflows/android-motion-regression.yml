name: Android Motion Regression

on:
  push:
    branches: [test/android-phase1-baseline]
    paths:
      - 'android/**'
      - '.github/workflows/android-motion-regression.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-motion-regression.yml'

permissions:
  contents: read

jobs:
  motion:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify wrapper checksum
        working-directory: android
        run: echo '81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
      - name: Exercise navigation and lazy-item animations
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: false
          working-directory: android
          script: ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.verba.interpretation.ui.ProductScreenContentTest,com.verba.interpretation.ui.design.GlassRevealTest,com.verba.interpretation.ui.RefinedNavigationTest,com.verba.interpretation.ui.facetoface.ConversationGuidanceScreenTest,com.verba.interpretation.ui.facetoface.FaceToFaceScreenTest,com.verba.interpretation.ui.facetoface.EarMicButtonTest,com.verba.interpretation.ui.interpretation.InterpretationScreenTest
      - name: Upload regression reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-motion-regression
          if-no-files-found: warn
          path: |
            android/app/build/reports/androidTests/**
            android/app/build/outputs/androidTest-results/**
