services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cloud
      POSTGRES_USER: cloud
      POSTGRES_PASSWORD: cloud-dev-only
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloud -d cloud"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - cloud-postgres-data:/var/lib/postgresql/data

  migrate:
    image: golang:1.25-alpine
    working_dir: /workspace
    command: ["go", "run", "./cmd/migrate", "up", "-migrations-dir", "/migrations"]
    environment:
      CLOUD_API_MIGRATE_DATABASE_URL: postgres://cloud:cloud-dev-only@postgres:5432/cloud?sslmode=disable
      CLOUD_API_MIGRATE_COMPOSE_SERVICE: "1"
      GOTOOLCHAIN: local
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./cloud-api:/workspace:ro
      - ./migrations:/migrations:ro
      - cloud-go-mod-cache:/go/pkg/mod

  cloud-api:
    image: golang:1.25-alpine
    working_dir: /workspace
    command: ["go", "run", "./cmd/cloud-api"]
    environment:
      CLOUD_API_ENV: development
      CLOUD_API_ADDR: :8080
      DATABASE_URL: postgres://cloud:cloud-dev-only@postgres:5432/cloud?sslmode=disable
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      GOTOOLCHAIN: local
      # JWT issuer, audiences, and distinct signing keys are intentionally not
      # committed. Inject them through the deployment secret mechanism.
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./cloud-api:/workspace:ro
      - cloud-go-mod-cache:/go/pkg/mod

volumes:
  cloud-postgres-data:
  cloud-go-mod-cache:
